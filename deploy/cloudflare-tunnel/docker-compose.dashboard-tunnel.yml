name: hosteye-dashboard-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared@sha256:d9ff527dc19799e24d3689058161fb01e752a24be1823577bae54c9c2489275f
    container_name: hosteye-dashboard-cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${HOSTEYE_CLOUDFLARE_TUNNEL_TOKEN:?Set HOSTEYE_CLOUDFLARE_TUNNEL_TOKEN in deploy/cloudflare-tunnel/.env}
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
