name: hosteye-public

services:
  edge-router:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./edge-router.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - control-plane
      - registration
      - collector-a
      - dynamic-config
      - dashboard-api
      - dashboard-web
    networks:
      - hosteye-public-network

  control-plane:
    build:
      context: ../../HostEyeBackend
      target: control_server
    restart: unless-stopped
    environment:
      PORT: "8080"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      PUBLIC_BASE_URL: "${HOSTEYE_PUBLIC_BASE_URL:-https://hosteye.csp.vn}"
      DEFAULT_COLLECTOR_ID: "collector-a"
      DEFAULT_COLLECTOR_URL: "${HOSTEYE_PUBLIC_BASE_URL:-https://hosteye.csp.vn}/api/v1/telemetry/collector-a"
      ADMISSION_MAX_ACTIVE_UPLOADS: "64"
      ADMISSION_LEASE_TTL_SECONDS: "30"
      ADMISSION_MAX_BATCH_MB: "5"
      ADMISSION_MAX_UPLOAD_RATE_KBPS: "1024"
      ALLOW_DEFAULT_COLLECTOR_FALLBACK: "true"
    depends_on:
      - clickhouse
    networks:
      - hosteye-public-network

  registration:
    build:
      context: ../../HostEyeRegistration
    restart: unless-stopped
    environment:
      PORT: "5054"
      HOSTEYE_REGISTRATION_STORE: "/app/data/registration-state.json"
      HOSTEYE_CA_CERTIFICATE: "/app/data/ca/company_ca.crt"
      HOSTEYE_CA_PRIVATE_KEY: "/app/data/ca/company_ca.key"
      HOSTEYE_REGISTRATION_ADMIN_TOKEN: "${HOSTEYE_REGISTRATION_ADMIN_TOKEN:?Set HOSTEYE_REGISTRATION_ADMIN_TOKEN}"
      HOSTEYE_BOOTSTRAP_SIGNING_KEY: "${HOSTEYE_BOOTSTRAP_SIGNING_KEY:?Set HOSTEYE_BOOTSTRAP_SIGNING_KEY}"
      HOSTEYE_CONTROL_URL: "${HOSTEYE_PUBLIC_BASE_URL:-https://hosteye.csp.vn}/api/v1/control/bootstrap"
      HOSTEYE_ADMISSION_URL: "${HOSTEYE_PUBLIC_BASE_URL:-https://hosteye.csp.vn}/api/v1/admission/request"
      HOSTEYE_TELEMETRY_URL: "${HOSTEYE_PUBLIC_BASE_URL:-https://hosteye.csp.vn}/api/v1/telemetry/collector-a"
      HOSTEYE_CONFIG_URL: "${HOSTEYE_PUBLIC_BASE_URL:-https://hosteye.csp.vn}/api/v1/dynamic-config/agent-config"
      NODE_ENV: "production"
    volumes:
      - hosteye_public_registration:/app/data
    networks:
      - hosteye-public-network

  dynamic-config:
    build:
      context: ../../HostEyeDynamicConfig
    restart: unless-stopped
    environment:
      HOSTEYE_DYNAMIC_CONFIG_PORT: "5063"
      HOSTEYE_DYNAMIC_CONFIG_STORE: "/app/data/dynamic-config-state.json"
      HOSTEYE_DYNAMIC_CONFIG_SIGNING_KEY: "${HOSTEYE_DYNAMIC_CONFIG_SIGNING_KEY:?Set HOSTEYE_DYNAMIC_CONFIG_SIGNING_KEY}"
      HOSTEYE_DYNAMIC_CONFIG_SIGNATURE_ALGORITHM: "hmac-sha256"
      HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKENS: "${HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKEN:?Set HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKEN}=policy:read,policy:write,agent:read,audit:read"
      HOSTEYE_DYNAMIC_CONFIG_REQUIRE_AGENT_IDENTITY: "true"
      HOSTEYE_DYNAMIC_CONFIG_AGENT_IDENTITY_SECRET: "${HOSTEYE_DYNAMIC_CONFIG_AGENT_IDENTITY_SECRET:?Set HOSTEYE_DYNAMIC_CONFIG_AGENT_IDENTITY_SECRET}"
      NODE_ENV: "production"
    volumes:
      - hosteye_public_dynamic_config:/app/data
    networks:
      - hosteye-public-network

  collector-a:
    build:
      context: ../../HostEyeBackend
      target: data_server
    restart: unless-stopped
    environment:
      PORT: "8088"
      COLLECTOR_ID: "collector-a"
      COLLECTOR_PUBLIC_URL: "${HOSTEYE_PUBLIC_BASE_URL:-https://hosteye.csp.vn}/api/v1/telemetry/collector-a"
      CONTROL_PLANE_URL: "http://control-plane:8080"
      REGISTRATION_URL: "http://registration:5054"
      REGISTRATION_ADMIN_TOKEN: "${HOSTEYE_REGISTRATION_ADMIN_TOKEN:?Set HOSTEYE_REGISTRATION_ADMIN_TOKEN}"
      REQUIRE_ENROLLED_IDENTITY: "${HOSTEYE_REQUIRE_ENROLLED_IDENTITY:-false}"
      VECTOR_URL: "http://vector-gateway:8686/"
      REDPANDA_PROXY_URL: "http://redpanda-broker:8082"
      RAW_CHUNK_TOPIC: "raw-chunk-jobs"
      DIRECT_VECTOR_FORWARD: "false"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      MAX_BODY_BYTES: "26214400"
      RAW_CHUNK_DIR: "/var/lib/hosteye/raw_chunks"
      REQUIRED_SCHEMA_VERSION: "1.0.0"
      ADMISSION_MAX_ACTIVE_UPLOADS: "64"
      COLLECTOR_UPLOAD_SLOT_MS: "1000"
    volumes:
      - hosteye_public_raw_chunks:/var/lib/hosteye/raw_chunks
    depends_on:
      - clickhouse
      - redpanda-broker
      - vector-gateway
    networks:
      - hosteye-public-network

  raw-chunk-worker:
    build:
      context: ../../HostEyeBackend
      target: worker_server
    restart: unless-stopped
    environment:
      REDPANDA_PROXY_URL: "http://redpanda-broker:8082"
      RAW_CHUNK_TOPIC: "raw-chunk-jobs"
      RAW_WORKER_GROUP: "raw-chunk-worker-public"
      RAW_WORKER_AUTO_OFFSET_RESET: "earliest"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      VECTOR_URL: "http://vector-gateway:8686/"
    volumes:
      - hosteye_public_raw_chunks:/var/lib/hosteye/raw_chunks
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
      vector-gateway:
        condition: service_started
    networks:
      - hosteye-public-network

  redpanda-broker:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    restart: unless-stopped
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --kafka-addr 0.0.0.0:9092
      - --advertise-kafka-addr redpanda-broker:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr redpanda-broker:8082
    volumes:
      - hosteye_public_redpanda:/var/lib/redpanda/data
    networks:
      - hosteye-public-network

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    depends_on:
      - redpanda-broker
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until rpk cluster info --brokers redpanda-broker:9092 >/dev/null 2>&1; do sleep 1; done;
        rpk topic create raw-chunk-jobs --brokers redpanda-broker:9092 || true
    networks:
      - hosteye-public-network

  vector-gateway:
    image: timberio/vector:0.35.0-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ../../Vector-HA-Cluster/vector-gateway.toml:/etc/vector/vector.toml:ro
      - hosteye_public_vector_data:/var/lib/vector
      - hosteye_public_vault:/var/log/soc_vault
    networks:
      - hosteye-public-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    volumes:
      - hosteye_public_clickhouse:/var/lib/clickhouse
      - ../../Vector-HA-Cluster/clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ../../Vector-HA-Cluster/clickhouse-config/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    networks:
      - hosteye-public-network

  dashboard-api:
    build:
      context: ../../HostEyeDashboardApi
    restart: unless-stopped
    environment:
      PORT: "5055"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "default"
      CLICKHOUSE_USERNAME: "default"
      CLICKHOUSE_PASSWORD: ""
      CORS_ORIGIN: "${HOSTEYE_PUBLIC_BASE_URL:-https://hosteye.csp.vn}"
      HOSTEYE_DYNAMIC_CONFIG_URL: "http://dynamic-config:5063"
      HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKEN: "${HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKEN:?Set HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKEN}"
      HOSTEYE_REGISTRATION_URL: "http://registration:5054"
      HOSTEYE_REGISTRATION_ADMIN_TOKEN: "${HOSTEYE_REGISTRATION_ADMIN_TOKEN:?Set HOSTEYE_REGISTRATION_ADMIN_TOKEN}"
      HOSTEYE_DASHBOARD_AUTH_REQUIRED: "true"
      HOSTEYE_DASHBOARD_USERS_FILE: "/var/lib/hosteye-dashboard/dashboard-users.json"
      HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_USERNAME: "${HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_PASSWORD: "${HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_PASSWORD:?Set HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_PASSWORD}"
      HOSTEYE_DASHBOARD_SESSION_TTL_MINUTES: "${HOSTEYE_DASHBOARD_SESSION_TTL_MINUTES:-480}"
      NODE_ENV: "production"
    volumes:
      - hosteye_public_dashboard_auth:/var/lib/hosteye-dashboard
      - hosteye_public_dashboard_data:/app/data
    depends_on:
      - clickhouse
      - dynamic-config
      - registration
    networks:
      - hosteye-public-network

  dashboard-web:
    build:
      context: ../../HostEyeDashboard
    restart: unless-stopped
    environment:
      PORT: "5174"
      HOSTEYE_API_TARGET: "http://dashboard-api:5055"
      NODE_ENV: "production"
    depends_on:
      - dashboard-api
    networks:
      - hosteye-public-network

networks:
  hosteye-public-network:
    name: hosteye-public-network

volumes:
  hosteye_public_clickhouse:
  hosteye_public_redpanda:
  hosteye_public_raw_chunks:
  hosteye_public_vector_data:
  hosteye_public_vault:
  hosteye_public_dynamic_config:
  hosteye_public_dashboard_auth:
  hosteye_public_dashboard_data:
  hosteye_public_registration:
