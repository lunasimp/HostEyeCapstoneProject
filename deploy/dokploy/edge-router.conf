events {}

http {
    log_format hosteye '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log hosteye;
    error_log /var/log/nginx/error.log warn;

    map $http_x_request_id $request_id_value {
        default $http_x_request_id;
        ""      $request_id;
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream control_plane { server control-plane:8080; }
    upstream collector_a { server collector-a:8088; }
    upstream dynamic_config { server dynamic-config:5063; }
    upstream registration { server registration:5054; }
    upstream dashboard_api { server dashboard-api:5055; }
    upstream dashboard_web { server dashboard-web:5174; }

    server {
        listen 8080;
        server_name _;
        client_max_body_size 26m;

        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"ok":true,"service":"hosteye-public-edge"}';
        }

        location /api/v1/telemetry/collector-a {
            proxy_pass http://collector_a;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        location = /api/v1/admission/request {
            proxy_pass http://control_plane;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        location = /api/v1/enroll {
            limit_except POST { deny all; }
            proxy_pass http://registration;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        location = /api/v1/agent/config {
            proxy_pass http://control_plane;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        location /api/v1/agent/config/ {
            proxy_pass http://control_plane;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header Host $host;
        }

        location /api/v1/agent/ {
            proxy_pass http://control_plane;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        location /api/v1/control/ {
            proxy_pass http://control_plane;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header Host $host;
        }

        location /api/v1/dynamic-config/ {
            proxy_pass http://dynamic_config;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://dashboard_api;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://dashboard_web;
            proxy_set_header X-Request-ID $request_id_value;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Host $host;
        }
    }
}
