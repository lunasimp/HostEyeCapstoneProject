events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 25m;

    upstream dashboard_web {
        server 127.0.0.1:5174;
    }

    upstream dashboard_api {
        server 127.0.0.1:5055;
    }

    upstream vector_ingest {
        server 127.0.0.1:8686;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location = / {
            return 302 /dashboard/;
        }

        location /dashboard/ {
            proxy_pass http://dashboard_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://dashboard_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/telemetry {
            proxy_pass http://vector_ingest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /artifacts/ {
            alias /opt/hosteye/artifacts/;
            autoindex on;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate /opt/hosteye/certs/hosteye-local.crt;
        ssl_certificate_key /opt/hosteye/certs/hosteye-local.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            return 302 /dashboard/;
        }

        location /dashboard/ {
            proxy_pass http://dashboard_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://dashboard_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/telemetry {
            proxy_pass http://vector_ingest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /artifacts/ {
            alias /opt/hosteye/artifacts/;
            autoindex on;
        }
    }
}

