[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/opt/hosteye/runtime/supervisord.pid

[program:clickhouse]
priority=10
command=/usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml
user=clickhouse
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:clickhouse-init]
priority=20
command=/usr/local/bin/init-clickhouse.sh
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vector]
priority=30
command=/usr/local/bin/vector --config /etc/vector/vector.toml
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard-api]
priority=40
directory=/opt/hosteye/VectorDashboardApi
environment=PORT="5055",CLICKHOUSE_URL="http://127.0.0.1:8123",CLICKHOUSE_DATABASE="default",CLICKHOUSE_USERNAME="default",CLICKHOUSE_PASSWORD="",CORS_ORIGIN="*"
command=/usr/bin/node src/server.js
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard-web]
priority=50
directory=/opt/hosteye/HostEyeDashboard
environment=PORT="5174"
command=/usr/bin/node server.js
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
priority=60
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

