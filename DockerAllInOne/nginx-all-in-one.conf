events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 25m;

    upstream dashboard_web {
        server 127.0.0.1:5174;
    }

    upstream dashboard_api {
        server 127.0.0.1:5055;
    }

    upstream vector_ingest {
        server 127.0.0.1:8686;
    }

    upstream clickhouse_http {
        server 127.0.0.1:8123;
    }

    # Single unified entrypoint. TLS is expected to be terminated by the
    # deployment platform (Dokploy / Traefik / load balancer) in front of this.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Emit relative redirects so the client keeps the external scheme/host/port
        # (correct when sitting behind a TLS-terminating reverse proxy).
        absolute_redirect off;

        location = / {
            return 302 /dashboard/;
        }

        location /dashboard/ {
            proxy_pass http://dashboard_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Telemetry ingest -> Vector (longest-prefix match wins over /api/)
        location /api/v1/telemetry {
            proxy_pass http://vector_ingest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://dashboard_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ClickHouse HTTP interface (port 8123). Native protocol (9000) is not
        # exposed since it is a raw TCP protocol that cannot be HTTP-proxied.
        location /clickhouse/ {
            proxy_pass http://clickhouse_http/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /artifacts/ {
            alias /opt/hosteye/artifacts/;
            autoindex on;
        }
    }
}
