[package]
name    = "hosteye-shipper"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "hosteye-shipper"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
reqwest      = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
async-stream = "0.3"
bytes        = "1"
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
sha2         = "0.10"
hmac         = "0.12"
hex          = "0.4"
rand         = "0.8"
chrono       = { version = "0.4",  features = ["serde"] }
flate2       = "1"
anyhow       = "1"
thiserror    = "1"
hostname     = "0.4"
url          = "2"
axum         = "0.7"
tower-http   = { version = "0.5", features = ["limit"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
