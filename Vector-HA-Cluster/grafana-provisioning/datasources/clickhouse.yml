apiVersion: 1

datasources:
  - name: SOC ClickHouse
    uid: soc-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      defaultDatabase: default
      port: 8123
