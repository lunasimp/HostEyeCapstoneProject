events {
    worker_connections 1024;
}

http {
    # rate=2r/s per cert serial, burst=20 cho phép spike ngắn sau gián đoạn
    # Zone 10m ≈ 160k unique cert serials (đủ cho fleet lớn)
    limit_req_zone $ssl_client_serial zone=telemetry_per_client:10m rate=2r/s;
    limit_conn_zone $ssl_client_serial zone=telemetry_conn_per_client:10m;
    # warn thay vì error: tránh spam log khi agent upload burst hợp lý
    limit_req_log_level warn;
    limit_conn_log_level warn;

    map $ssl_client_serial $soc_client_allowed {
        default 0;
        # Quản lý thủ công: thêm serial bằng lệnh openssl + reload nginx
        # Format: "SERIAL_HEX" 1;   # Comment mô tả máy
        # Thu hồi: xóa dòng hoặc comment ra → reload nginx
        include /etc/nginx/certs/client_allowlist.conf;
    }


    upstream control_plane {
        server control-plane:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream data_plane_collectors {
        server collector-a:8088 max_fails=3 fail_timeout=10s;
        server collector-b:8088 max_fails=3 fail_timeout=10s;
        server collector-c:8088 max_fails=3 fail_timeout=10s;
        server collector-d:8088 max_fails=3 fail_timeout=10s;
        server collector-e:8088 max_fails=3 fail_timeout=10s;
        server collector-f:8088 max_fails=3 fail_timeout=10s;
        server collector-g:8088 max_fails=3 fail_timeout=10s;
        server collector-h:8088 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream collector_a {
        server collector-a:8088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream collector_b {
        server collector-b:8088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream collector_c {
        server collector-c:8088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream collector_d {
        server collector-d:8088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream collector_e {
        server collector-e:8088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream collector_f {
        server collector-f:8088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream collector_g {
        server collector-g:8088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream collector_h {
        server collector-h:8088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream dashboard_web {
        server dashboard-web:5174;
        keepalive 16;
    }

    upstream dashboard_api {
        server dashboard-api:5055;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name hosteye.iahn.hanoi.vn;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name hosteye.iahn.hanoi.vn;

        ssl_certificate /etc/nginx/certs/soc_server.crt;
        ssl_certificate_key /etc/nginx/certs/soc_server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4:!DH;
        ssl_prefer_server_ciphers on;

        # Optional at server level so signed config downloads can work without a
        # client certificate. The telemetry path below still enforces mTLS.
        ssl_client_certificate /etc/nginx/certs/company_ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 2;
        # TLS session reuse: giảm overhead handshake cho agents reconnect thường xuyên
        # shared:SSL:10m ≈ 40k session, timeout 10m phù hợp với reconnect pattern của agent
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location = /api/v1/telemetry/collector-a {
            limit_req zone=telemetry_per_client burst=20 nodelay;
            limit_conn telemetry_conn_per_client 4;
            limit_req_status 429;
            limit_conn_status 429;
            error_page 429 = @telemetry_rate_limited;

            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            if ($soc_client_allowed != 1) {
                return 403;
            }

            proxy_pass http://collector_a/api/v1/telemetry/collector-a;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location = /api/v1/telemetry/collector-b {
            limit_req zone=telemetry_per_client burst=20 nodelay;
            limit_conn telemetry_conn_per_client 4;
            limit_req_status 429;
            limit_conn_status 429;
            error_page 429 = @telemetry_rate_limited;

            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            if ($soc_client_allowed != 1) {
                return 403;
            }

            proxy_pass http://collector_b/api/v1/telemetry/collector-b;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
