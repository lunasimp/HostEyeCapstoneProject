events {
    worker_connections 1024;
}

http {
    limit_req_zone $ssl_client_serial zone=telemetry_per_client:10m rate=2r/s;
    limit_conn_zone $ssl_client_serial zone=telemetry_conn_per_client:10m;

    map $ssl_client_serial $soc_client_allowed {
        default 0;
        include /etc/nginx/certs/client_allowlist.conf;
    }

    upstream vector_gateways {
        server vector-gateway-1:8686 max_fails=3 fail_timeout=10s;
        server vector-gateway-2:8686 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream ingest_ack_gateway {
        server ingest-ack-gateway:8088 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream dashboard_web {
        server dashboard-web:5174;
        keepalive 16;
    }

    upstream dashboard_api {
        server dashboard-api:5055;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name hosteye.iahn.hanoi.vn;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name hosteye.iahn.hanoi.vn;

        ssl_certificate /etc/nginx/certs/soc_server.crt;
        ssl_certificate_key /etc/nginx/certs/soc_server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!RC4:!DH;
        ssl_prefer_server_ciphers on;

        # Optional at server level so signed config downloads can work without a
        # client certificate. The telemetry path below still enforces mTLS.
        ssl_client_certificate /etc/nginx/certs/company_ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        location /api/v1/telemetry {
            limit_req zone=telemetry_per_client burst=20 nodelay;
            limit_conn telemetry_conn_per_client 4;
            limit_req_status 429;
            limit_conn_status 429;
            error_page 429 = @telemetry_rate_limited;

            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            if ($soc_client_allowed != 1) {
                return 403;
            }

            proxy_pass http://ingest_ack_gateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location @telemetry_rate_limited {
            add_header Retry-After 30 always;
            return 429;
        }

        location /dashboard/ {
            proxy_pass http://dashboard_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/admission/request {
            limit_req zone=telemetry_per_client burst=20 nodelay;
            limit_conn telemetry_conn_per_client 4;
            limit_req_status 429;
            limit_conn_status 429;
            error_page 429 = @telemetry_rate_limited;

            if ($ssl_client_verify != SUCCESS) {
                return 403;
            }

            if ($soc_client_allowed != 1) {
                return 403;
            }

            proxy_pass http://ingest_ack_gateway/api/v1/admission/request;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Cert-Serial $ssl_client_serial;
            proxy_set_header X-Client-Cert-Subject $ssl_client_s_dn;
            proxy_set_header X-Client-Verify $ssl_client_verify;
        }

        location = /api/v1/agent/config {
            proxy_pass http://ingest_ack_gateway/api/v1/agent/config;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/agent/config/ {
            proxy_pass http://ingest_ack_gateway/api/v1/agent/config/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://dashboard_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}



