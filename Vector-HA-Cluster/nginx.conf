        # Rate limit response: log riêng để dễ phát hiện agent upload quá mạnh
        location @telemetry_rate_limited {
            access_log /var/log/nginx/rate_limited.log combined;
            add_header Retry-After 30 always;
            add_header X-RateLimit-Limit "2r/s;burst=20" always;
            add_header X-RateLimit-Policy "per-cert-serial" always;
            return 429;
        }

        location /dashboard/ {
            proxy_pass http://dashboard_web/;
