      RAW_WORKER_AUTO_OFFSET_RESET: "${RAW_WORKER_AUTO_OFFSET_RESET:-earliest}"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      VECTOR_URL: "http://vector-gateway-1:8686/"
    volumes:
