services:
  # ===========================================================================
  # 1. TẦNG CÂN BẰNG TẢI & CHỐT CHẶN BIÊN BIÊN MẠNG (LOAD BALANCER LAYER)
  # ===========================================================================
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "80:80"   # Hứng luồng chuyển hướng (HTTP Redirect)
      - "443:443" # 🔐 SỬA LỖI CHÍ MẠNG: Mở cổng HTTPS công cộng đón nhận luồng mTLS từ Agent
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro # Phân phối chứng chỉ mTLS an toàn vào Nginx
    depends_on:
      - control-plane
      - hosteye-registration
      - hosteye-dynamic-config
      - collector-a
      - collector-b
      - collector-c
      - collector-d
      - collector-e
      - collector-f
      - collector-g
      - collector-h
      - vector-gateway-1
      - vector-gateway-2
      - dashboard-web
      - dashboard-api
    networks:
      - soc-network

  # ===========================================================================
  # 2. TẦNG TIẾP NHẬN PHI TRẠNG THÁI & LÀM SẠCH PII (VECTOR GATEWAY CLUSTER)
  # ===========================================================================
  vector-gateway-1:
    image: timberio/vector:0.35.0-alpine
    container_name: vector-gateway-1
    volumes:
      - ./vector-gateway.toml:/etc/vector/vector.toml:ro
      - ./soc_vault:/var/log/soc_vault # 🔐 VÁ LỖ HỔNG VẤN ĐỀ 6: Ánh xạ kho log thô gốc (Cold Storage) an toàn xuống đĩa cứng vật lý
    command: ["--config", "/etc/vector/vector.toml"]
    networks:
      - soc-network

  vector-gateway-2:
    image: timberio/vector:0.35.0-alpine
    container_name: vector-gateway-2
    volumes:
      - ./vector-gateway.toml:/etc/vector/vector.toml:ro
      - ./soc_vault:/var/log/soc_vault # Đảm bảo tính sẵn sàng cao đồng bộ đĩa lưu trữ pháp chứng
    command: ["--config", "/etc/vector/vector.toml"]
    networks:
      - soc-network

  control-plane:
    build:
      context: ../HostEyeBackend
      target: control_server
    container_name: hosteye-control-plane
    environment:
      PORT: "8080"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      PUBLIC_BASE_URL: "https://hosteye.iahn.hanoi.vn"
      DEFAULT_COLLECTOR_ID: "collector-a"
      DEFAULT_COLLECTOR_URL: "https://hosteye.iahn.hanoi.vn/api/v1/telemetry/collector-a"
      ADMISSION_MAX_ACTIVE_UPLOADS: "64"
      ADMISSION_LEASE_TTL_SECONDS: "30"
      ADMISSION_MAX_BATCH_MB: "5"
      ADMISSION_MAX_UPLOAD_RATE_KBPS: "1024"
      CONTROL_SEND_AFTER_MS: "${CONTROL_SEND_AFTER_MS:-0}"
      CONTROL_COLLECTOR_SLOT_MS: "${CONTROL_COLLECTOR_SLOT_MS:-1000}"
      ALLOW_DEFAULT_COLLECTOR_FALLBACK: "${ALLOW_DEFAULT_COLLECTOR_FALLBACK:-false}"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - clickhouse
    networks:
      - soc-network

  hosteye-registration:
    build:
      context: ../HostEyeRegistration
    container_name: hosteye-registration
    environment:
      PORT: "5054"
      HOSTEYE_REGISTRATION_STORE: "/app/data/registration-state.json"
      HOSTEYE_CA_CERTIFICATE: "/app/data/ca/company_ca.crt"
      HOSTEYE_CA_PRIVATE_KEY: "/app/data/ca/company_ca.key"
      HOSTEYE_REGISTRATION_ADMIN_TOKEN: "${HOSTEYE_REGISTRATION_ADMIN_TOKEN:-hosteye-registration-admin-demo}"
      HOSTEYE_BOOTSTRAP_SIGNING_KEY: "${HOSTEYE_BOOTSTRAP_SIGNING_KEY:-hosteye-bootstrap-demo-signing-key-change-me}"
      HOSTEYE_CONTROL_URL: "http://127.0.0.1:8080/api/v1/control/bootstrap"
      HOSTEYE_ADMISSION_URL: "http://127.0.0.1:8080/api/v1/admission/request"
      HOSTEYE_TELEMETRY_URL: "http://127.0.0.1:8088/api/v1/telemetry/collector-a"
      HOSTEYE_CONFIG_URL: "http://127.0.0.1:5063/api/v1/dynamic-config/agent-config"
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:5054:5054"
    volumes:
      - hosteye_registration_data:/app/data
    networks:
      - soc-network
    restart: unless-stopped

  hosteye-dynamic-config:
    build:
      context: ../HostEyeDynamicConfig
    container_name: hosteye-dynamic-config
    environment:
      HOSTEYE_DYNAMIC_CONFIG_PORT: "5063"
      HOSTEYE_DYNAMIC_CONFIG_STORE: "/app/data/dynamic-config-state.json"
      HOSTEYE_DYNAMIC_CONFIG_SIGNING_KEY: "hosteye-dynamic-config-demo-key"
      HOSTEYE_DYNAMIC_CONFIG_SIGNATURE_ALGORITHM: "ed25519"
      HOSTEYE_DYNAMIC_CONFIG_ED25519_KEY_ID: "hosteye-demo-ed25519-v1"
      HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKENS: "hosteye-admin-demo=policy:read,policy:write,agent:read,audit:read;hosteye-readonly=policy:read"
      HOSTEYE_DYNAMIC_CONFIG_REQUIRE_AGENT_IDENTITY: "true"
      HOSTEYE_DYNAMIC_CONFIG_AGENT_IDENTITY_SECRET: "hosteye-agent-identity-demo-secret"
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:5063:5063"
    volumes:
      - hosteye_dynamic_config_data:/app/data
    networks:
      - soc-network
    restart: unless-stopped

  collector-a:
    build:
      context: ../HostEyeBackend
      target: data_server
    container_name: hosteye-collector-a
    environment:
      PORT: "8088"
      COLLECTOR_ID: "collector-a"
      COLLECTOR_PUBLIC_URL: "https://hosteye.iahn.hanoi.vn/api/v1/telemetry/collector-a"
      CONTROL_PLANE_URL: "http://control-plane:8080"
      REGISTRATION_URL: "http://hosteye-registration:5054"
      REGISTRATION_ADMIN_TOKEN: "${HOSTEYE_REGISTRATION_ADMIN_TOKEN:-hosteye-registration-admin-demo}"
      REQUIRE_ENROLLED_IDENTITY: "${HOSTEYE_REQUIRE_ENROLLED_IDENTITY:-false}"
      VECTOR_URL: "http://vector-gateway-1:8686/"
      REDPANDA_PROXY_URL: "http://redpanda-broker:8082"
      RAW_CHUNK_TOPIC: "raw-chunk-jobs"
      DIRECT_VECTOR_FORWARD: "false"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      MAX_BODY_BYTES: "26214400"
      RAW_CHUNK_DIR: "/var/lib/hosteye/raw_chunks"
      REQUIRED_SCHEMA_VERSION: "1.0.0"
      ADMISSION_MAX_ACTIVE_UPLOADS: "64"
      COLLECTOR_UPLOAD_SLOT_MS: "${COLLECTOR_UPLOAD_SLOT_MS:-1000}"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./raw_chunks:/var/lib/hosteye/raw_chunks
    depends_on:
      - clickhouse
      - redpanda-broker
      - vector-gateway-1
      - vector-gateway-2
    networks:
      - soc-network

