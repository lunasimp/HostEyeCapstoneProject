      - clickhouse
      - vector-gateway-1
      - vector-gateway-2
    networks:
      - soc-network

  # ===========================================================================
  # 3. TẦNG ĐỆM TRUNG GIAN GIẢM CHẤN XUNG LỰC (MESSAGE BROKER LAYER)
  # ===========================================================================
  redpanda-broker:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: redpanda-broker
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-broker:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - ./redpanda_data:/var/lib/redpanda/data # Đảm bảo hàng đợi không bị mất cấu trúc khi reset hạ tầng
    networks:
      - soc-network

  # ===========================================================================
  # 4. STORAGE & DASHBOARD LAYER
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: local-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse-config/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    networks:
      - soc-network

  grafana:
    image: grafana/grafana:latest
    container_name: soc-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - clickhouse
    networks:
      - soc-network

  dashboard-api:
    image: node:20-alpine
    container_name: hosteye-dashboard-api
    working_dir: /app
    command: ["node", "src/server.js"]
    environment:
      PORT: "5055"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "default"
      CLICKHOUSE_USERNAME: "default"
      CLICKHOUSE_PASSWORD: ""
      CORS_ORIGIN: "*"
      NODE_ENV: "production"
    ports:
      - "5055:5055"
    volumes:
      - ../VectorDashboardApi:/app:ro
    depends_on:
      - clickhouse
    networks:
      - soc-network

  dashboard-web:
    image: node:20-alpine
    container_name: hosteye-dashboard-web
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      PORT: "5174"
      HOSTEYE_API_TARGET: "http://hosteye-dashboard-api:5055"
      NODE_ENV: "production"
    ports:
      - "5174:5174"
    volumes:
      - ../HostEyeDashboard:/app:ro
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge

volumes:
  clickhouse_data:
