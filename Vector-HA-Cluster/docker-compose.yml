      - vector-gateway-2
    networks:
      - soc-network

  raw-chunk-worker:
    build:
      context: ../HostEyeBackend
      target: worker_server
    container_name: hosteye-raw-chunk-worker
    environment:
      REDPANDA_PROXY_URL: "http://redpanda-broker:8082"
      RAW_CHUNK_TOPIC: "raw-chunk-jobs"
      RAW_WORKER_GROUP: "${RAW_WORKER_GROUP:-raw-chunk-worker-v3}"
      RAW_WORKER_INSTANCE: "${RAW_WORKER_INSTANCE:-hosteye-raw-chunk-worker-1}"
      RAW_WORKER_AUTO_OFFSET_RESET: "${RAW_WORKER_AUTO_OFFSET_RESET:-earliest}"
      RAW_WORKER_CHECKPOINT_PATH: "/var/lib/hosteye/raw_chunks/.worker-offsets.json"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      VECTOR_URL: "http://vector-gateway-1:8686/"
    volumes:
      - ./raw_chunks:/var/lib/hosteye/raw_chunks
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
      vector-gateway-1:
        condition: service_started
      vector-gateway-2:
        condition: service_started
    networks:
      - soc-network

  # ===========================================================================
  # 3. TẦNG ĐỆM TRUNG GIAN GIẢM CHẤN XUNG LỰC (MESSAGE BROKER LAYER)
  # ===========================================================================
  redpanda-broker:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: redpanda-broker
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-broker:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://redpanda-broker:8082
    ports:
      - "19092:19092"
    volumes:
      - ./redpanda_data:/var/lib/redpanda/data # Đảm bảo hàng đợi không bị mất cấu trúc khi reset hạ tầng
    networks:
      - soc-network

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    depends_on:
      - redpanda-broker
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until rpk cluster info --brokers redpanda-broker:9092 >/dev/null 2>&1; do sleep 1; done;
        rpk topic create raw-chunk-jobs --brokers redpanda-broker:9092 || true
    networks:
      - soc-network

  # ===========================================================================
  # 4. STORAGE & DASHBOARD LAYER
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: hosteye-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse-config/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    networks:
      - soc-network

  grafana:
    image: grafana/grafana:latest
    container_name: soc-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - clickhouse
    networks:
      - soc-network

  dashboard-api:
    image: node:20-alpine
    container_name: hosteye-dashboard-api
    working_dir: /app
    command: ["node", "src/server.js"]
    environment:
      PORT: "5055"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "default"
      CLICKHOUSE_USERNAME: "default"
      CLICKHOUSE_PASSWORD: ""
      CORS_ORIGIN: "${HOSTEYE_DASHBOARD_CORS_ORIGIN:-http://localhost:5174}"
      HOSTEYE_DYNAMIC_CONFIG_URL: "http://hosteye-dynamic-config:5063"
      HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKEN: "hosteye-admin-demo"
      HOSTEYE_REGISTRATION_URL: "http://hosteye-registration:5054"
      HOSTEYE_REGISTRATION_ADMIN_TOKEN: "${HOSTEYE_REGISTRATION_ADMIN_TOKEN:-hosteye-registration-admin-demo}"
      HOSTEYE_DASHBOARD_AUTH_REQUIRED: "true"
      HOSTEYE_DASHBOARD_USERS_FILE: "/var/lib/hosteye-dashboard/dashboard-users.json"
      HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_USERNAME: "${HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_PASSWORD: "${HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_PASSWORD:?Set HOSTEYE_DASHBOARD_BOOTSTRAP_ADMIN_PASSWORD in Vector-HA-Cluster/.env}"
      HOSTEYE_DASHBOARD_SESSION_TTL_MINUTES: "${HOSTEYE_DASHBOARD_SESSION_TTL_MINUTES:-480}"
      HOSTEYE_DASHBOARD_LOGIN_ATTEMPT_LIMIT: "${HOSTEYE_DASHBOARD_LOGIN_ATTEMPT_LIMIT:-5}"
      HOSTEYE_DASHBOARD_LOGIN_ATTEMPT_WINDOW_MINUTES: "${HOSTEYE_DASHBOARD_LOGIN_ATTEMPT_WINDOW_MINUTES:-15}"
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - ../HostEyeDashboardApi:/app:ro
      - hosteye_dashboard_auth_data:/var/lib/hosteye-dashboard
    depends_on:
      - clickhouse
      - hosteye-dynamic-config
      - hosteye-registration
    networks:
      - soc-network

  dashboard-web:
    image: node:20-alpine
    container_name: hosteye-dashboard-web
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      PORT: "5174"
      HOSTEYE_API_TARGET: "http://hosteye-dashboard-api:5055"
      HOSTEYE_PUBLIC_HOST: "${HOSTEYE_DASHBOARD_PUBLIC_HOST:-hosteye.csp.vn}"
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ../HostEyeDashboard:/app:ro
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge

volumes:
  clickhouse_data:
  hosteye_dynamic_config_data:
  hosteye_dashboard_auth_data:
  hosteye_registration_data:
