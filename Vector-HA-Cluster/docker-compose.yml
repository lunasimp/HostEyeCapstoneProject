  # ===========================================================================
  # 3. Táº¦NG Äá»†M TRUNG GIAN GIáº¢M CHáº¤N XUNG Lá»°C (MESSAGE BROKER LAYER)
  # ===========================================================================
  redpanda-broker:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: redpanda-broker
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-broker:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - ./redpanda_data:/var/lib/redpanda/data # Äáº£m báº£o hÃ ng Ä‘á»£i khÃ´ng bá»‹ máº¥t cáº¥u trÃºc khi reset háº¡ táº§ng
    networks:
      - soc-network

  # ===========================================================================
  # 4. STORAGE & DASHBOARD LAYER
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: local-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse-config/users.d/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    networks:
      - soc-network

  grafana:
    image: grafana/grafana:latest
    container_name: soc-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - clickhouse
    networks:
      - soc-network

  hosteye-dynamic-config:
    build:
      context: ../HostEyeDynamicConfig
    container_name: hosteye-dynamic-config
    environment:
      HOSTEYE_DYNAMIC_CONFIG_PORT: "5063"
      HOSTEYE_DYNAMIC_CONFIG_STORE: "/app/data/dynamic-config-state.json"
      HOSTEYE_DYNAMIC_CONFIG_SIGNING_KEY: "hosteye-dynamic-config-demo-key"
      HOSTEYE_DYNAMIC_CONFIG_SIGNATURE_ALGORITHM: "ed25519"
      HOSTEYE_DYNAMIC_CONFIG_ED25519_KEY_ID: "hosteye-demo-ed25519-v1"
      HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKENS: "hosteye-admin-demo=policy:read,policy:write,agent:read,audit:read;hosteye-readonly=policy:read"
      HOSTEYE_DYNAMIC_CONFIG_REQUIRE_AGENT_IDENTITY: "true"
      HOSTEYE_DYNAMIC_CONFIG_AGENT_IDENTITY_SECRET: "hosteye-agent-identity-demo-secret"
    ports:
      - "5063:5063"
    volumes:
      - hosteye_dynamic_config_data:/app/data
    networks:
      - soc-network
    restart: unless-stopped
  dashboard-api:
    image: node:20-alpine
    container_name: hosteye-dashboard-api
    working_dir: /app
    command: ["node", "src/server.js"]
    environment:
      PORT: "5055"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_DATABASE: "default"
      CLICKHOUSE_USERNAME: "default"
      CLICKHOUSE_PASSWORD: ""
      CORS_ORIGIN: "*"
      HOSTEYE_DYNAMIC_CONFIG_URL: "http://hosteye-dynamic-config:5063"
      HOSTEYE_DYNAMIC_CONFIG_ADMIN_TOKEN: "hosteye-admin-demo"
      NODE_ENV: "production"
    ports:
      - "5055:5055"
    volumes:
      - ../HostEyeDashboardApi:/app:ro
    depends_on:
      - clickhouse
      - hosteye-dynamic-config
    networks:
      - soc-network

  dashboard-web:
    image: node:20-alpine
    container_name: hosteye-dashboard-web
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      PORT: "5174"
      HOSTEYE_API_TARGET: "http://hosteye-dashboard-api:5055"
      NODE_ENV: "production"
    ports:
      - "5174:5174"
    volumes:
      - ../HostEyeDashboard:/app:ro
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge

volumes:
  clickhouse_data:
  hosteye_dynamic_config_data:

