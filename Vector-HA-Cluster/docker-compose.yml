services:
  # ===========================================================================
  # 1. Táº¦NG CÃ‚N Báº°NG Táº¢I & CHá»T CHáº¶N BIÃŠN BIÃŠN Máº NG (LOAD BALANCER LAYER)
  # ===========================================================================
  nginx-lb:
    image: nginx:alpine
    container_name: nginx-load-balancer
    ports:
      - "80:80"   # Há»©ng luá»“ng chuyá»ƒn hÆ°á»›ng (HTTP Redirect)
      - "443:443" # ðŸ” Sá»¬A Lá»–I CHÃ Máº NG: Má»Ÿ cá»•ng HTTPS cÃ´ng cá»™ng Ä‘Ã³n nháº­n luá»“ng mTLS tá»« Agent
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro # PhÃ¢n phá»‘i chá»©ng chá»‰ mTLS an toÃ n vÃ o Nginx
    depends_on:
      - control-plane
      - collector-a
      - collector-b
      - collector-c
      - collector-d
      - collector-e
      - collector-f
      - collector-g
      - collector-h
      - vector-gateway-1
      - vector-gateway-2
      - dashboard-web
      - dashboard-api
    networks:
      - soc-network

  # ===========================================================================
  # 2. Táº¦NG TIáº¾P NHáº¬N PHI TRáº NG THÃI & LÃ€M Sáº CH PII (VECTOR GATEWAY CLUSTER)
  # ===========================================================================
  vector-gateway-1:
    image: timberio/vector:0.35.0-alpine
    container_name: vector-gateway-1
    volumes:
      - ./vector-gateway.toml:/etc/vector/vector.toml:ro
      - ./soc_vault:/var/log/soc_vault # ðŸ” VÃ Lá»– Há»”NG Váº¤N Äá»€ 6: Ãnh xáº¡ kho log thÃ´ gá»‘c (Cold Storage) an toÃ n xuá»‘ng Ä‘Ä©a cá»©ng váº­t lÃ½
    command: ["--config", "/etc/vector/vector.toml"]
    networks:
      - soc-network

  vector-gateway-2:
    image: timberio/vector:0.35.0-alpine
    container_name: vector-gateway-2
    volumes:
      - ./vector-gateway.toml:/etc/vector/vector.toml:ro
      - ./soc_vault:/var/log/soc_vault # Äáº£m báº£o tÃ­nh sáºµn sÃ ng cao Ä‘á»“ng bá»™ Ä‘Ä©a lÆ°u trá»¯ phÃ¡p chá»©ng
    command: ["--config", "/etc/vector/vector.toml"]
    networks:
      - soc-network

  control-plane:
    image: node:20-alpine
    container_name: hosteye-control-plane
    working_dir: /app
    command: ["node", "control-server.js"]
    environment:
      PORT: "8080"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      MAX_BODY_BYTES: "26214400"
      LEASE_STORE_DIR: "/var/lib/hosteye/leases"
      CONFIG_ARTIFACT_DIR: "/var/lib/hosteye/agent_config"
      PUBLIC_BASE_URL: "https://hosteye.iahn.hanoi.vn"
      DEFAULT_COLLECTOR_ID: "collector-a"
      DEFAULT_COLLECTOR_URL: "https://hosteye.iahn.hanoi.vn/api/v1/telemetry/collector-a"
      AGENT_CONFIG_VERSION: "1.0.0"
      AGENT_CONFIG_POLICY_ID: "hosteye-default-ingest-policy"
      AGENT_CONFIG_KEY_ID: "hosteye-hmac-demo-v1"
      AGENT_CONFIG_SIGNING_KEY: "hosteye-dynamic-config-demo-key"
      ADMISSION_MAX_ACTIVE_UPLOADS: "64"
      ADMISSION_LEASE_TTL_SECONDS: "30"
      ADMISSION_MAX_BATCH_MB: "5"
      ADMISSION_MAX_UPLOAD_RATE_KBPS: "1024"
      CONTROL_SEND_AFTER_MS: "${CONTROL_SEND_AFTER_MS:-0}"
      CONTROL_COLLECTOR_SLOT_MS: "${CONTROL_COLLECTOR_SLOT_MS:-1000}"
      ALLOW_DEFAULT_COLLECTOR_FALLBACK: "${ALLOW_DEFAULT_COLLECTOR_FALLBACK:-false}"
      REQUIRE_UPLOAD_LEASE: "true"
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../VectorIngestAckGateway:/app:ro
      - ./leases:/var/lib/hosteye/leases
      - ../VectorBuild:/var/lib/hosteye/agent_config:ro
    depends_on:
      - clickhouse
    networks:
      - soc-network

