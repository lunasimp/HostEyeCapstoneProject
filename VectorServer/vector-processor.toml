data_dir = "C:/ProgramData/Vector/processor_data"

# 1. K??????????????????o d?????????????????????????? li????????????????????????????????u b??????????????????????????t ???????????????????????????????????????????????????????????ng b???????????????????????????????? t?????????????????????????? Kafka Pool
[sources.pull_from_kafka]
type = "kafka"
bootstrap_servers = "127.0.0.1:19092"
topics = ["windows-logs-pool"]
group_id = "storage-ingester-group-v4"

librdkafka_options."session.timeout.ms" = "45000"
librdkafka_options."max.poll.interval.ms" = "300000"

[transforms.prepare_batch]
type = "remap"
inputs = ["pull_from_kafka"]
source = '''
outer = parse_json(.message) ?? {}
if is_object(outer) {
    meta = .
    del(meta.message)
    meta.kafka_timestamp = meta.timestamp
    del(meta.timestamp)
    . = merge!(meta, outer)
}

batch_payload = null
if exists(.message) && is_string(.message) {
    batch_payload = parse_json(.message) ?? null
}

if is_array(batch_payload) {
    .batch_events = batch_payload
} else if is_object(batch_payload) {
    .batch_events = [batch_payload]
} else {
    .batch_events = [.] 
}
'''

[transforms.split_batch]
type = "lua"
version = "2"
inputs = ["prepare_batch"]

[transforms.split_batch.hooks]
process = '''
function(event, emit)
  local batch = event.log.batch_events
  if type(batch) == "table" then
    for _, item in pairs(batch) do
      if type(item) == "table" then
        local out = { log = item }
        out.log.kafka_timestamp = event.log.kafka_timestamp
        out.log.topic = event.log.topic
        out.log.partition = event.log.partition
        out.log.offset = event.log.offset
        emit(out)
      end
    end
  else
    emit(event)
  end
end
'''
[transforms.advanced_normalization]
type = "remap"
inputs = ["split_batch"]
source = '''
# 1. Th?????????????????????????? parse JSON theo nhi??????????????????????????u k????????????????????????????????ch b??????????????????????????n (Kh??????????????????ng d??????????????????ng bi??????????????????????????n err v?????????????????? ???????????????????????????????????????????? c?????????????????? to??????????????????n t?????????????????????????? co-alescing ?? b??????????????????????????o v????????????????????????????????)
parsed_payload = parse_json(.message) ?? parse_json(string!(.)) ?? null

# Kafka value la HTTP envelope: { "message": "[{event}]", "path": "/", ... }.
# Can parse them lop message ben trong de lay event that.
if is_object(parsed_payload) && exists(parsed_payload.message) && is_string(parsed_payload.message) {
    nested_payload = parse_json(parsed_payload.message) ?? null
    if is_array(nested_payload) {
        nested_payload = nested_payload[0]
    }
    if is_object(nested_payload) {
        parsed_payload = merge!(parsed_payload, nested_payload)
    }
}

# HTTP sink cua Agent gui body JSON theo dang array; voi batch thi la [{event1}, {event2}, ...].
# Vector 0.35 khong co unnest transform, nhanh nay chi la fallback; split_batch moi la co che tach batch chinh.
if is_array(parsed_payload) {
    parsed_payload = parsed_payload[0]
}

# Ki??????????????????????????????m tra tr??????????????????????????c ti??????????????????????????p n??????????????????????????u parse th??????????????????nh c??????????????????ng v?????????????????? tr?????????????????????????? v?????????????????????????? m????????????????????????????????t object h??????????????????????????p l????????????????????????????????
if is_object(parsed_payload) {
    meta = .
    del(meta.message)
    meta.kafka_timestamp = meta.timestamp
    del(meta.timestamp)
    . = merge!(meta, parsed_payload)
} else {
    # Kh????????????????????????????????i c??????????????????????????u h???????????????????????????????? (Fallback): N??????????????????????????u b???????????????????????????????? b??????????????????????????c b??????????????????????????i HTTP envelope, ??????????????????p ki??????????????????????????????u object an to??????????????????n
    . = merge(., object(parsed_payload) ?? {})
}

# --- PH??????????????????????????N ????????????????????????P KI????????????????????????????????U V???????????????????????? TR??????????????????CH XU??????????????????????????T H??????????????????????????P NH??????????????????????????T ---
.event_id = to_int(.event_id) ?? to_int(.EventID) ?? 0
.record_id = to_int(.record_id) ?? to_int(.RecordID) ?? 0
.partition = to_int(.partition) ?? 0
.offset = to_int(.offset) ?? 0

# ????????????????????i??????????????????????????n gi?????????????????? tr???????????????????????????????? m??????????????????????????c ??????????????????????????????????????????????????????????nh cho tr??????????????????????????????????????????????ng computer n??????????????????????????u b???????????????????????????????? khuy??????????????????????????t do ??????????????????????????????????????????????????????????i path
.computer = to_string(.computer) ?? to_string(.Computer) ?? "UNKNOWN_CLIENT"

# Defaults for columns that may be absent on many Windows/Sysmon event types.
.user_name = to_string(.user_name) ?? ""
.user_id = to_string(.user_id) ?? ""
.rule_name = ""
.process_guid = ""
.parent_process_guid = ""
.parent_process_path = ""
.current_directory = ""
.hashes = ""
.imphash = ""
.target_filename = ""
.target_object = ""
.target_image = ""
.target_process_guid = ""
.target_process_id = 0
.granted_access = ""
.call_trace = ""
.query_status = ""
.source_port = 0
.protocol = ""
.initiated = ""

if exists(.event_data) {
    .user_name = to_string(.event_data.User) ?? to_string(.event_data.SubjectUserName) ?? .user_name
    .user_id = to_string(.event_data.UserID) ?? to_string(.event_data.UserSid) ?? to_string(.event_data.SubjectUserSid) ?? .user_id
    .rule_name = to_string(.event_data.RuleName) ?? ""

    .process_guid = to_string(.event_data.ProcessGuid) ?? ""
    .parent_process_guid = to_string(.event_data.ParentProcessGuid) ?? ""
    .process_id = to_int(.event_data.ProcessId) ?? to_int(.event_data.ProcessID) ?? 0
    .parent_process_id = to_int(.event_data.ParentProcessId) ?? 0
    .target_process_id = to_int(.event_data.TargetProcessId) ?? 0

    .process_path = to_string(.event_data.Image) ?? to_string(.event_data.Path) ?? ""
    .parent_process_path = to_string(.event_data.ParentImage) ?? ""
    .target_image = to_string(.event_data.TargetImage) ?? ""
    .current_directory = to_string(.event_data.CurrentDirectory) ?? ""

    .command_line = to_string(.event_data.CommandLine) ?? ""
    .parent_command_line = to_string(.event_data.ParentCommandLine) ?? ""
    .script_block_text = to_string(.event_data.ScriptBlockText) ?? ""

    .hashes = to_string(.event_data.Hashes) ?? ""
    .imphash = to_string(.event_data.IMP_HASH) ?? to_string(.event_data.Imphash) ?? ""

    .source_ip = to_string(.event_data.SourceIp) ?? to_string(.event_data.SourceIP) ?? ""
    .source_port = to_int(.event_data.SourcePort) ?? 0
    .destination_ip = to_string(.event_data.DestinationIp) ?? to_string(.event_data.DestinationIP) ?? ""
    .destination_port = to_int(.event_data.DestinationPort) ?? 0
    .protocol = to_string(.event_data.Protocol) ?? ""
    .initiated = to_string(.event_data.Initiated) ?? ""
    .dns_query = to_string(.event_data.QueryName) ?? ""
    .query_status = to_string(.event_data.QueryStatus) ?? ""

    .target_filename = to_string(.event_data.TargetFilename) ?? ""
    .target_object = to_string(.event_data.TargetObject) ?? ""
    .target_process_guid = to_string(.event_data.TargetProcessGuid) ?? ""
    .granted_access = to_string(.event_data.GrantedAccess) ?? ""
    .call_trace = to_string(.event_data.CallTrace) ?? ""

    .event_data_json = encode_json(.event_data)
    del(.event_data)
}

# 3. Sinh kh??????????????????a ??????????????????????????????????????????????????????????nh danh ??????????????????????????????????????????????????????????c b??????????????????????????n ch????????????????????????????????ng ghi tr??????????????????ng l??????????????????????????p (SHA-256)
c_str = to_string(.computer)
ch_str = to_string(.channel) ?? "unknown"
r_str = to_string(.record_id)
raw_string = join([c_str, ch_str, r_str], separator: "-") ?? ""
.idempotency_key = sha2(raw_string, "SHA-256")
'''

[sinks.clickhouse_store]
