[package]
name = "hosteye-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "control_server"
path = "src/servers/control_server.rs"

[[bin]]
name = "data_server"
path = "src/servers/data_server.rs"

[[bin]]
name = "worker_server"
path = "src/servers/worker_server.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
# rdkafka removed: Redpanda access via REST Proxy (reqwest HTTP), no native Kafka client needed
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
clickhouse = { version = "0.12", features = ["rustls-tls"] }
bytes = "1"
quick-xml = { version = "0.31", features = ["serialize"] }
